{% extends "layout.html" %}

{% block title %}Edit Event - {{ event.title }}{% endblock %}

{% block content %}
<h2>Edit Event</h2>

<form action="/event/{{ event.id }}/update" method="post">
  <p>
    <label for="title">Title:</label><br>
    <input type="text" name="title" id="title" value="{{ event.title }}" required maxlength="50">
  </p>
  <p>
    <label for="description">Description:</label><br>
    <textarea name="description" id="description" rows="5" cols="40" required maxlength="1000">{{ event.description }}</textarea>
  </p>
  <p>
    <label for="event_date">Date:</label><br>
    <input type="date" name="event_date" id="event_date" value="{{ event.event_date }}" required>
  </p>
  <p>
    <label>Categories:</label><br>
    {% for category in categories %}
      <input type="checkbox" name="categories" value="{{ category.id }}" id="cat_{{ category.id }}"
        {% if category.id in event_category_ids %}checked{% endif %}>
      <label for="cat_{{ category.id }}">{{ category.name }}</label><br>
    {% endfor %}
  </p>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
  <input type="submit" value="Save Changes">
</form>

<p><a href="/event/{{ event.id }}">Cancel</a></p>
{% endblock %}
