{% extends "layout.html" %}

{% block title %}Party Planner - New Event{% endblock %}

{% block content %}
<h2>Create a New Event</h2>

<form action="/create_event" method="post">
  <p>
    <label for="title">Title:</label><br>
    <input type="text" name="title" id="title" value="{{ title or '' }}">
  </p>
  <p>
    <label for="description">Description:</label><br>
    <textarea name="description" id="description" rows="5" cols="40">{{ description or '' }}</textarea>
  </p>
  <p class="inline-form">
    <label for="event_date">Start Date:</label>
    <input type="date" name="event_date" id="event_date" value="{{ event_date or '' }}">
  
    <label for="end_date">End Date (optional):</label>
    <input type="date" name="end_date" id="end_date" value="{{ end_date or '' }}">
  </p>
  <p>
    <label>Categories:</label><br>
    {% for category in categories %}
      <input type="checkbox" name="categories" value="{{ category.id }}" id="cat_{{ category.id }}"
        {% if event_category_ids and category.id in event_category_ids %}checked{% endif %}>
      <label for="cat_{{ category.id }}">{{ category.name }}</label><br>
    {% endfor %}
  </p>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
  <input type="submit" value="Create Event">
</form>
{% endblock %}
